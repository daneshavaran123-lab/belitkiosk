name: Windows app

# نسخهٔ ویندوزی کامل (برنامهٔ دسکتاپ + سرویس کارت‌خوان + نصب‌کننده) را روی ویندوز می‌سازد.
# خروجی در بخش Artifacts همین اجرا قابل دانلود است؛ با تگ v* به Release هم پیوست می‌شود.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile || {
            echo "Lockfile registry unreachable; installing from registry.npmjs.org"
            rm -f bun.lock
            BUN_CONFIG_REGISTRY=https://registry.npmjs.org bun install
          }

      - name: Card-reader bridge tests
        run: dotnet test pos-bridge/tests/PosBridge.Tests

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Windows package
        run: node scripts/build-windows-app.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: MuseumKiosk-Windows
          path: release/MuseumKiosk-Windows
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: کیوسک موزه — نسخهٔ ویندوزی ${{ github.ref_name }}
          body_path: installers/RELEASE-NOTES.md
          files: release/MuseumKiosk-Windows.zip
